<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Team Task Manager</h1>
	<button id="darkModeBtn" onclick="toggleDarkMode()">
   	 Dark Mode
	</button>

        <p class="subtitle">
            A simple project developed using GitFlow
        </p>

        <div class="task-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>

        <h2>Team Tasks</h2>

        <ul id="taskList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
